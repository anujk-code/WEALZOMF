<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthVriddhi - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-700">WealthVriddhi</h1>
            <p class="text-gray-500 mt-2">Login to your Investment Dashboard</p>
        </div>

        <!-- Form level par autocomplete block kiya gaya hai -->
        <form id="loginForm" class="space-y-6" autocomplete="off">
            <div>
                <label class="block text-gray-700 font-bold mb-2">User ID (PAN Number)</label>
                <!-- Inputs mein 'new-password' lagaya hai taaki Chrome purani email na chipkaye -->
                <input type="text" id="panInput" autocomplete="new-password" placeholder="e.g. ABCDE1234F" class="w-full px-4 py-3 rounded-lg border focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none uppercase" required>
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="passwordInput" autocomplete="new-password" placeholder="Enter Password" class="w-full px-4 py-3 rounded-lg border focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Secure Login
            </button>
            <p id="errorMsg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
        </form>
    </div>

    <script>
        // Aapka asli Supabase URL aur Publishable Key
        const SUPABASE_URL = 'https://rlllspfhssonpfbqhkbu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UO0if8aY29MU98v7EOSMzg_QJSK4JZL';
        
        // Crash theek karne ke liye naya naam: supabaseClient
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pan = document.getElementById('panInput').value.trim().toUpperCase();
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            // Dummy Email Trick (PAN ko email mein badalna)
            const dummyEmail = pan + '@wealthvriddhi.com';

            // Login check process
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: dummyEmail,
                password: password,
            });

            if (error) {
                // Agar password galat hoga ya account nahi bana hoga, toh turant screen par error dikhega
                console.error("Login Error:", error);
                alert("Login Failed: " + error.message);
                errorMsg.innerText = "Error: " + error.message;
                errorMsg.classList.remove('hidden');
            } else {
                // Login successful hone par dashboard par bhej dega
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
