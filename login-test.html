<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEALZOMF - Client Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; text-align: center; }
        .login-portal { padding: 50px; }
        .box { background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; margin-bottom: 20px; }
        input { margin: 10px; padding: 12px; width: 280px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 30px; font-size: 16px; cursor: pointer; background-color: #003366; color: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #002244; }
    </style>
</head>
<body>

    <!-- Client Login Section -->
    <section class="login-portal">
        <div class="box">
            <h2>WEALZOMF Client Login</h2>
            <div>
                <input type="text" id="panInput" placeholder="Enter PAN Number" style="text-transform: uppercase;">
            </div>
            <div>
                <input type="text" id="folioInput" placeholder="Enter Folio Number">
            </div>
            <br>
            <button id="loginBtn">Login</button>
            <p id="message"></p>
        </div>
    </section>

    <!-- Firebase & Login Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // Aapki exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBMcDGkSVzbM4HYZyzPl_yfG8EBeDgh-UQ",
            authDomain: "wealzomf-a1c10.firebaseapp.com",
            projectId: "wealzomf-a1c10",
            storageBucket: "wealzomf-a1c10.firebasestorage.app",
            messagingSenderId: "361957885601",
            appId: "1:361957885601:web:e933ec16b708cd94d812e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("loginBtn");

            if (loginBtn) {
                loginBtn.addEventListener("click", async () => {
                    // Values le rahe hain (PAN ko auto capital letters mein convert kiya hai)
                    const pan = document.getElementById("panInput").value.trim().toUpperCase();
                    const folio = document.getElementById("folioInput").value.trim();
                    const messageEl = document.getElementById("message");

                    if (!pan || !folio) {
                        messageEl.innerText = "Please enter both PAN and Folio Number!";
                        messageEl.style.color = "orange";
                        return;
                    }

                    messageEl.innerText = "Connecting to database...";
                    messageEl.style.color = "blue";

                    try {
                        const querySnapshot = await getDocs(collection(db, "client"));
                        let loginSuccess = false;
                        let loggedInName = "";
                        let loggedInFolio = "";

                        querySnapshot.forEach((doc) => {
                            let data = doc.data();
                            
                            // Check match condition: PAN & Folio
                            if (data.pan === pan && String(data.folio) === folio) {
                                loginSuccess = true;
                                loggedInName = data.name;
                                loggedInFolio = data.folio;
                                window.loggedInClient = data; // Poora client data store kar rahe hain
                            }
                        });

                        if (loginSuccess) {
                            // Dashboard ke liye LocalStorage mein data set karna
                            localStorage.setItem("clientName", loggedInName);
                            localStorage.setItem("clientPan", pan);
                            localStorage.setItem("clientFolio", loggedInFolio);
                            
                            localStorage.setItem("clientScheme", window.loggedInClient.scheme || "-");
                            localStorage.setItem("clientUnits", window.loggedInClient.units || 0);
                            localStorage.setItem("clientInvestment", window.loggedInClient.investment || 0);
                            localStorage.setItem("clientCurrentValue", window.loggedInClient.currentValue || 0);
                            localStorage.setItem("clientProfitLoss", window.loggedInClient.profitLoss || 0);

                            messageEl.innerText = "Login Successful! Redirecting to Dashboard...";
                            messageEl.style.color = "green";
                            
                            // 1 second baad Dashboard par bhej dega
                            setTimeout(() => {
                                window.location.href = "dashboard.html";
                            }, 1000);
                        } else {
                            messageEl.innerText = "Wrong PAN or Folio number!";
                            messageEl.style.color = "red";
                        }
                    } catch (error) {
                        messageEl.innerText = "Database Error: " + error.message;
                        messageEl.style.color = "red";
                    }
                });
            }
        });
    </script>
</body>
</html>
